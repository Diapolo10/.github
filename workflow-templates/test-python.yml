# This workflow tests Python code, using mise to handle tool installation and Taskfile to handle the rest

name: Test Python code

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*' # Avoid re-running existing commit on release

jobs:
  lint:
    uses: diapolo10/.github/.github/workflows/test-python.yml@c8ea0e99f7a5a688ae8f39d4f2163387f231ef1c
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
