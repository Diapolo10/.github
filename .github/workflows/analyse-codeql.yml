# Analyses the code quality of the project

name: 'CodeQL'

on:
  workflow_call:
    inputs:
      languages:
        description: 'A stringified JSON array of languages to analyse, e.g. ["python"]'
        default: '["actions", "python"]'
        type: string

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: '/language:${{matrix.language}}'
