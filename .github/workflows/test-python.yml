# This workflow tests Python code, using mise to handle tool installation and Taskfile to handle the rest

name: Test Python code

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'A stringified JSON array of Python versions to test against, e.g. ["3.12", "3.13", "3.14"]'
        required: true
        type: string

jobs:
  test-and-build-python:
    if: (github.event_name != 'pull_request' && ! github.event.pull_request.head.repo.fork) || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || startsWith(github.head_ref, 'dependabot/')))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550

      - name: Install project
        run: task install

      - name: Test ${{ matrix.os }}-${{ matrix.python-version }}
        run: task test

      - name: Upload test results to CodeCov
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          env_vars: PYTHON_VERSION
          fail_ci_if_error: false
          name: '${{ matrix.os }} - Python ${{ matrix.python-version }}'
          use_oidc: true

      - name: Build ${{ matrix.os }}-${{ matrix.python-version }} wheel
        run: task build:python

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  testpypi-deploy:
    name: Build and publish Python 🐍 distributions 📦 to TestPyPI
    environment: testpypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: test-and-build-python
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: true
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        continue-on-error: true
        with:
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
