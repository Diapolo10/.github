# Analyses the code quality of the project

name: 'CodeQL'

on:
  workflow_call:
    inputs:
      languages:
        description: 'A stringified JSON array of languages to analyse, e.g. ["python"]'
        default: '["actions"]'
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: '/language:${{matrix.language}}'
